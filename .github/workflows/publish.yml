name: Publish @lila-care/design-system

on:
  push:
    branches: [main]
    paths:
      - "packages/design-system/**"
      - ".changeset/**"

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@lila-care"

      - name: Install root changesets CLI
        run: npm install --no-save @changesets/cli

      - name: Install package dependencies
        working-directory: packages/design-system
        run: npm install

      - name: Build package
        working-directory: packages/design-system
        run: npm run build

      # changesets/action reads changeset files at the repo root, bumps
      # packages/design-system/package.json, and either opens a "Version Packages" PR
      # (when changesets are pending) or publishes (when a version bump was just merged).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish --cwd packages/design-system
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
